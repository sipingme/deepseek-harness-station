name: Build desktop installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:win
      - run: pnpm smoke:installer
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Station-Windows-x64
          path: |
            dist/DeepSeek-Harness-Station-*-x64-Setup.exe
            dist/DeepSeek-Harness-Station-*-x64-Setup.exe.blockmap
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Station-macOS-${{ matrix.arch }}
          path: |
            dist/DeepSeek-Harness-Station-*-${{ matrix.arch }}.dmg
            dist/DeepSeek-Harness-Station-*-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
