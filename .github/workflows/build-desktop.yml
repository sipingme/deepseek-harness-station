name: Build desktop installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:win
      - run: pnpm smoke:installer
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Station-Windows-x64
          path: |
            dist/DeepSeek-Harness-Station-*-x64-Setup.exe
            dist/DeepSeek-Harness-Station-*-x64-Setup.exe.blockmap
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Release tag must match package.json version' }
          $installer = Get-Item -LiteralPath "dist/DeepSeek-Harness-Station-$version-x64-Setup.exe"
          $assets = @($installer.FullName, "$($installer.FullName).blockmap", (Resolve-Path 'dist/SHA256SUMS.txt').Path)
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          } else {
            $notesArgs = if (Test-Path "docs/release-$version.zh-CN.md") { @('--notes-file', "docs/release-$version.zh-CN.md") } else { @('--generate-notes') }
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag @notesArgs --prerelease --title "DeepSeek Harness Station $env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          }

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Station-macOS-${{ matrix.arch }}
          path: |
            dist/DeepSeek-Harness-Station-*-${{ matrix.arch }}.dmg
            dist/DeepSeek-Harness-Station-*-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
