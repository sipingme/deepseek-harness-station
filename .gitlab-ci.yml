stages:
  - package

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  cache:
    key: "pnpm-${CI_JOB_NAME}"
    paths:
      - .pnpm-store/

.package:
  stage: package
  before_script:
    - node --version
    - corepack pnpm --version
    - corepack pnpm config set store-dir .pnpm-store
    - corepack pnpm install --frozen-lockfile

windows-x64:
  extends: .package
  variables:
    # These variables are present while GitLab Runner fetches and cleans the
    # worktree, before before_script can run. This is required for deep pnpm
    # dependency paths on Windows.
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: "core.longpaths"
    GIT_CONFIG_VALUE_0: "true"
  before_script:
    - node --version
    - New-Item -ItemType Directory -Force -Path .corepack | Out-Null
    - corepack enable --install-directory .corepack
    - $env:PATH = "$(Resolve-Path .corepack);$env:PATH"
    - pnpm --version
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  tags:
    - windows
    - x64
  script:
    - corepack pnpm dist:win
    - corepack pnpm smoke:installer
    - .\scripts\publish-gitlab-package.ps1
  artifacts:
    name: "DeepSeek-Harness-Station-Windows-x64-${CI_COMMIT_SHORT_SHA}"
    expire_in: 14 days
    paths:
      - dist/DeepSeek-Harness-Station-*-x64-Setup.exe
      - dist/DeepSeek-Harness-Station-*-x64-Setup.exe.blockmap
      - dist/SHA256SUMS.txt
      - dist/PACKAGE.txt
